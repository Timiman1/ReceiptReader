name: CI

on:
  push:
    branches:
      - main
      - interview-polish
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ReceiptReader.sln

      - name: Build
        run: dotnet build ReceiptReader.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ReceiptReader.sln --configuration Release --no-build --verbosity normal